name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS App (Release, Unsigned)
        run: |
          cd apps/ios
          xcodebuild -project Mural.xcodeproj \
            -scheme Mural \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find apps/ios/build -name "Mural.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Mural.app" -type d | head -n 1)
          fi
          echo "Found APP_PATH: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Mural-Gemini.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mural-Gemini-IPA
          path: Mural-Gemini.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-mural-release
          name: "Mural Native iOS v2.0.0 (SideStore / AltStore)"
          body: "Application iOS native Mural issue du code source officiel avec 3 zones indépendantes (Hermes VPS, Gemini, Groq)."
          files: Mural-Gemini.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
