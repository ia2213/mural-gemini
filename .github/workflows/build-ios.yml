name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS App (Release, Unsigned)
        run: |
          xcodebuild -project apps/ios/Mural.xcodeproj \
            -alltargets \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            VALIDATE_WORKSPACE=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          
          # Find main app in default derived data location
          APP_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "Mural.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            # Fallback: search entire filesystem
            APP_PATH=$(find / -name "Mural.app" -type d 2>/dev/null | head -n 1)
          fi
          echo "Found APP_PATH: $APP_PATH"
          
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" "Payload/Mural.app"
          else
            echo "Error: Mural.app not found"
            exit 1
          fi
          
          # Find widget extension
          WIDGET_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "MuralWidgetExtension.appex" -type d 2>/dev/null | head -n 1)
          if [ -z "$WIDGET_PATH" ]; then
            WIDGET_PATH=$(find / -name "MuralWidgetExtension.appex" -type d 2>/dev/null | head -n 1)
          fi
          
          if [ -n "$WIDGET_PATH" ]; then
            mkdir -p "Payload/Mural.app/PlugIns"
            cp -R "$WIDGET_PATH" "Payload/Mural.app/PlugIns/"
            echo "Added widget extension to IPA"
          else
            echo "Warning: Widget extension not found in build output"
          fi
          
          zip -r -y Mural-Gemini.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mural-Gemini-IPA
          path: Mural-Gemini.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v2.0.0-mural-release
          name: "Mural Native iOS v2.0.0 (SideStore / AltStore)"
          body: "Application iOS native Mural issue du code source officiel avec 3 zones indépendantes (Hermes VPS, Gemini, Groq)."
          files: Mural-Gemini.ipa
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
