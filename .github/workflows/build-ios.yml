name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build main app and widget
        run: |
          xcodebuild -project apps/ios/Fluence.xcodeproj \
            -scheme Fluence \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            VALIDATE_WORKSPACE=NO \
            clean build

      - name: Find and package app
        run: |
          mkdir -p Payload

          # Main app from build directory
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH"
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/Mural.app
          else
            echo "ERROR: App bundle not found in build/"
            exit 1
          fi

          # Copy explicit icon files directly into app bundle root
          cp -f apps/ios/App/Assets.xcassets/AppIcon.appiconset/*.png Payload/Mural.app/ || true

          # Remove any embedded PlugIns that block Free Apple Developer signing
          rm -rf Payload/Mural.app/PlugIns

          zip -r -y Fluence.ipa Payload
          cp Fluence.ipa Mural-Gemini.ipa
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mural-Gemini-IPA
          path: Mural-Gemini.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v2.0.0-mural-release
          name: "Mural Native iOS v2.0.0 (SideStore / AltStore)"
          body: "Application iOS native Mural issue du code source officiel avec 3 zones indépendantes (Hermes VPS, Gemini, Groq)."
          files: Mural-Gemini.ipa
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
