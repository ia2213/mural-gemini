name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS App (Release, Unsigned)
        run: |
          xcodebuild -project apps/ios/Mural.xcodeproj \
            -scheme Mural \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            VALIDATE_WORKSPACE=NO \
            clean build

      - name: Copy App and Widget to Payload
        run: |
          mkdir -p Payload

          # Main app
          APP_PATH=$(find build -name "Mural.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH"
          cp -R "$APP_PATH" Payload/Mural.app

          # Widget extension (may or may not be present)
          WIDGET_PATH=$(find build -name "MuralWidgetExtension.appex" -type d | head -n 1)
          echo "WIDGET_PATH=$WIDGET_PATH"
          if [ -n "$WIDGET_PATH" ]; then
            mkdir -p Payload/Mural.app/PlugIns
            cp -R "$WIDGET_PATH" Payload/Mural.app/PlugIns/
            echo "Widget extension included"
          else
            echo "Warning: widget extension not found"
          fi

          zip -r -y Mural-Gemini.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mural-Gemini-IPA
          path: Mural-Gemini.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v2.0.0-mural-release
          name: "Mural Native iOS v2.0.0 (SideStore / AltStore)"
          body: "Application iOS native Mural issue du code source officiel avec 3 zones indépendantes (Hermes VPS, Gemini, Groq)."
          files: Mural-Gemini.ipa
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
