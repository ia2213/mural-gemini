name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_16.0.app || sudo xcode-select -switch /Applications/Xcode.app || true

      - name: Build iOS App (Release, Unsigned)
        run: |
          cd apps/ios
          xcodebuild -project Mural.xcodeproj \
            -scheme Mural \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find apps/ios/build -name "Mural.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Mural.app" -type d | head -n 1)
          fi
          echo "Found APP_PATH: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Mural-Gemini.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mural-Gemini-IPA
          path: Mural-Gemini.ipa
