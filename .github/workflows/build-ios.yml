name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build main app and widget
        run: |
          set +e
          xcodebuild -project apps/ios/Fluence.xcodeproj \
            -scheme Fluence \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            VALIDATE_WORKSPACE=NO \
            clean build 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$BUILD_EXIT" >> build.log
          echo "exit_code: $BUILD_EXIT" > build_exit.txt

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build.log
            build_exit.txt
          retention-days: 30

      - name: Upload build directory
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-dir
          path: build/
          retention-days: 7

      - name: Find and package app
        if: success()
        run: |
          mkdir -p Payload

          # Main app from build directory
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH"
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/Fluence.app
          else
            echo "ERROR: App bundle not found in build/"
            exit 1
          fi

          # Copy explicit icon files directly into app bundle root
          cp -f apps/ios/App/Assets.xcassets/AppIcon.appiconset/*.png Payload/Fluence.app/ || true

          # Remove any embedded PlugIns that block Free Apple Developer signing
          rm -rf Payload/Fluence.app/PlugIns

          zip -r -y Fluence.ipa Payload
          cp Fluence.ipa Fluence-v3.0.ipa
          rm -rf Payload

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fluence-v3.0-IPA
          path: Fluence-v3.0.ipa

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-mural-release
          name: "Fluence iOS v3.0 (SideStore / AltStore)"
          body: "Application iOS native Fluence issue du code source officiel avec moteur d'apprentissage FSRS, Whisper.cpp on-device, et conformité sécurité Keychain."
          files: Fluence-v3.0.ipa
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
