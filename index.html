<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mural AI Language Teacher</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #FDFBF7;
      --card-bg: #FFFFFF;
      --text: #1A1A1A;
      --subtext: #666666;
      --accent: #FF6B35;
      --accent-light: #FFE8E0;
      --border: #E8E5DF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .orb {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF6B35, #FFAA00);
      margin: 0 auto 12px;
      box-shadow: 0 8px 24px rgba(255, 107, 53, 0.3);
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    p.subtitle { font-size: 14px; color: var(--subtext); }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--subtext);
      margin-bottom: 12px;
    }

    .lang-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .lang-btn {
      background: #F5F3EE;
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lang-btn.selected {
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .lang-name { font-size: 14px; font-weight: 600; }
    .lang-native { font-size: 12px; color: var(--subtext); }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #F9F8F5;
      font-size: 14px;
      outline: none;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
      max-height: 350px;
      overflow-y: auto;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.4;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: #EFECE6;
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .btn-main {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 24px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }

    .btn-mic {
      background: #EFECE6;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
    }

    .btn-mic.recording {
      background: #FF3B30;
      color: white;
      animation: pulse 1s infinite;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="orb"></div>
    <h1>Mural AI Teacher</h1>
    <p class="subtitle">Pratique ta langue en direct avec Groq</p>
  </div>

  <div class="card">
    <div class="card-title">Langue d'apprentissage</div>
    <div class="lang-grid" id="langGrid"></div>
  </div>

  <div class="card">
    <div class="card-title">Moteur IA & Fournisseur</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <select id="providerSelect">
        <option value="auto">Auto (Groq → Gemini → VPS)</option>
        <option value="groq">Groq API</option>
        <option value="google">Google Gemini API</option>
        <option value="hermes_vps">Mon Agent Hermes VPS</option>
      </select>
      <input type="password" id="apiKey" placeholder="Clé API Groq / Gemini">
      <input type="text" id="vpsEndpoint" placeholder="Endpoint VPS (ex: http://vps:20128/v1/chat/completions)">
      <select id="modelSelect">
        <option value="llama-3.1-8b-instant" selected>Llama 3.1 8B Instant (Ultra-Rapide Groq)</option>
        <option value="qwen-2.5-32b">Qwen 2.5 32B (Groq)</option>
        <option value="gemini-2.5-flash">Gemini 2.5 Flash (Google)</option>
        <option value="auto/best-coding">Hermes Agent (VPS)</option>
      </select>
    </div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="bubble assistant" id="greetingBubble">Hallo! Wie geht es dir heute?</div>
  </div>

  <div style="margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; background:#F5F3EE; padding:8px 12px; border-radius:10px;">
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; cursor:pointer; color:var(--text);">
      <input type="checkbox" id="autoMicToggle" style="width:auto; cursor:pointer;">
      ⚡ Mode Conversation Continue (Appel Mains-Libres)
    </label>
    <span style="font-size:11px; color:var(--subtext);">Maintiens le micro ou parle</span>
  </div>

  <div class="controls">
    <button class="btn-mic" id="micBtn">🎙️</button>
    <input type="text" id="userInput" placeholder="Écris ou parle..." style="flex:1;">
    <button class="btn-main" id="sendBtn" style="flex:initial; padding:12px 18px;">Envoyer</button>
  </div>
  <div id="sttLangBadge" style="font-size:12px; color:var(--subtext); text-align:center; margin-top:8px; font-weight:500;">🎙️ Reconnaissance vocale : Deutsch (de-DE)</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const LANGUAGES = [
      { id: "de", name: "Allemand 🇩🇪", native: "Deutsch", locale: "de-DE", greeting: "Hallo! Wie geht es dir heute?" },
      { id: "fr", name: "Français 🇫🇷", native: "Français", locale: "fr-FR", greeting: "Bonjour ! Comment vas-tu ?" },
      { id: "en-US", name: "Anglais US 🇺🇸", native: "American English", locale: "en-US", greeting: "Hey there! How are you?" },
      { id: "en-GB", name: "Anglais UK 🇬🇧", native: "British English", locale: "en-GB", greeting: "Hello! How are you today?" },
      { id: "es", name: "Espagnol 🇪🇸", native: "Español", locale: "es-ES", greeting: "¡Hola! ¿Cómo estás?" },
      { id: "it", name: "Italien 🇮🇹", native: "Italiano", locale: "it-IT", greeting: "Ciao! Come stai?" },
      { id: "ro", name: "Roumain 🇷🇴", native: "Română", locale: "ro-RO", greeting: "Salut! Ce mai faci?" },
      { id: "ar", name: "Arabe 🇸🇦", native: "العربية", locale: "ar-SA", greeting: "مرحبًا! كيف حالك اليوم؟" },
      { id: "he", name: "Hébreu 🇮🇱", native: "עברית", locale: "he-IL", greeting: "שלום! מה שלומך?" },
      { id: "ja", name: "Japonais 🇯🇵", native: "日本語", locale: "ja-JP", greeting: "こんにちは！お元気ですか？" },
      { id: "ru", name: "Russe 🇷🇺", native: "Русский", locale: "ru-RU", greeting: "Привет! Как дела?" }
    ];

    let currentLang = localStorage.getItem("mural_lang") || "de";
    let apiKey = localStorage.getItem("mural_groq_key") || "";
    let vpsEndpoint = localStorage.getItem("mural_vps_endpoint") || "";
    let currentProvider = localStorage.getItem("mural_provider") || "auto";

    const langGrid = document.getElementById("langGrid");
    const providerSelect = document.getElementById("providerSelect");
    const apiKeyInput = document.getElementById("apiKey");
    const vpsEndpointInput = document.getElementById("vpsEndpoint");
    const modelSelect = document.getElementById("modelSelect");
    const chatContainer = document.getElementById("chatContainer");
    const greetingBubble = document.getElementById("greetingBubble");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");

    apiKeyInput.value = apiKey;
    vpsEndpointInput.value = vpsEndpoint;
    providerSelect.value = currentProvider;

    providerSelect.onchange = () => {
      currentProvider = providerSelect.value;
      localStorage.setItem("mural_provider", currentProvider);
    };

    vpsEndpointInput.onchange = () => {
      vpsEndpoint = vpsEndpointInput.value.trim();
      localStorage.setItem("mural_vps_endpoint", vpsEndpoint);
    };

    const sttLangBadge = document.getElementById("sttLangBadge");

    function updateSttLangBadge() {
      const langInfo = LANGUAGES.find(l => l.id === currentLang) || LANGUAGES[0];
      if (sttLangBadge) {
        sttLangBadge.textContent = `🎙️ Reconnaissance vocale activée en : ${langInfo.name} (${langInfo.locale})`;
      }
    }

    function renderLangs() {
      langGrid.innerHTML = "";
      LANGUAGES.forEach(l => {
        const btn = document.createElement("div");
        btn.className = `lang-btn ${l.id === currentLang ? "selected" : ""}`;
        btn.innerHTML = `<div><div class="lang-name">${l.name}</div><div class="lang-native">${l.native}</div></div>`;
        btn.onclick = () => {
          currentLang = l.id;
          localStorage.setItem("mural_lang", l.id);
          renderLangs();
          greetingBubble.textContent = l.greeting;
          speakText(l.greeting, l.locale);
        };
        langGrid.appendChild(btn);
      });
      updateSttLangBadge();
    }

    renderLangs();

    apiKeyInput.onchange = () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem("mural_groq_key", apiKey);
    };

    const autoMicToggle = document.getElementById("autoMicToggle");

    let audioQueue = [];
    let isSpeaking = false;

    function resetAudioQueue() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      audioQueue = [];
      isSpeaking = false;
    }

    function warmupSpeech() {
      if ('speechSynthesis' in window && !window.speechSynthesis.speaking) {
        const silent = new SpeechSynthesisUtterance(" ");
        silent.volume = 0.01;
        window.speechSynthesis.speak(silent);
      }
    }

    function queueSentenceSpeech(text, locale) {
      if (!('speechSynthesis' in window) || !text.trim()) return;
      const utterance = new SpeechSynthesisUtterance(text.trim());
      utterance.lang = locale;
      utterance.rate = 1.05; // ligeramente plus rapide pour fluidité
      audioQueue.push(utterance);
      processAudioQueue();
    }

    function processAudioQueue() {
      if (isSpeaking || audioQueue.length === 0) return;
      isSpeaking = true;
      const nextUtterance = audioQueue.shift();

      nextUtterance.onend = () => {
        isSpeaking = false;
        if (audioQueue.length > 0) {
          processAudioQueue();
        } else if (autoMicToggle && autoMicToggle.checked && typeof startMicRecording === "function") {
          setTimeout(() => { startMicRecording(); }, 250);
        }
      };
      nextUtterance.onerror = () => {
        isSpeaking = false;
        if (audioQueue.length > 0) processAudioQueue();
      };

      window.speechSynthesis.speak(nextUtterance);
    }

    function speakText(text, locale) {
      resetAudioQueue();
      queueSentenceSpeech(text, locale);
    }

    async function executeCallStream(endpoint, key, modelName, messages, onChunk) {
      const headers = { "Content-Type": "application/json" };
      if (key) { headers["Authorization"] = `Bearer ${key}`; }
      
      const res = await fetch(endpoint, {
        method: "POST",
        headers: headers,
        body: JSON.stringify({
          model: modelName,
          messages: messages,
          max_tokens: 100,
          temperature: 0.5,
          stream: true
        })
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      if (!res.body) throw new Error("No response body for streaming");

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";
      let fullText = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        
        const lines = buffer.split("\n");
        buffer = lines.pop();
        
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed === "data: [DONE]") continue;
          if (trimmed.startsWith("data: ")) {
            try {
              const json = JSON.parse(trimmed.slice(6));
              const delta = json.choices?.[0]?.delta?.content;
              if (delta) {
                fullText += delta;
                onChunk(delta, fullText);
              }
            } catch (e) {
              // ignore incomplete JSON chunk
            }
          }
        }
      }
      return fullText;
    }

    async function sendPrompt(text) {
      if (!text.trim()) return;
      resetAudioQueue();
      
      const userBubble = document.createElement("div");
      userBubble.className = "bubble user";
      userBubble.textContent = text;
      chatContainer.appendChild(userBubble);
      userInput.value = "";
      chatContainer.scrollTop = chatContainer.scrollHeight;

      const langInfo = LANGUAGES.find(l => l.id === currentLang) || LANGUAGES[0];
      const provider = providerSelect.value;
      const model = modelSelect.value;
      const key = apiKeyInput.value.trim();
      const vps = vpsEndpointInput.value.trim();

      const assistantBubble = document.createElement("div");
      assistantBubble.className = "bubble assistant";
      assistantBubble.textContent = "";
      chatContainer.appendChild(assistantBubble);

      const messages = [
        { role: "system", content: `You are a friendly language teacher helping practice ${langInfo.name}. Reply in ${langInfo.name} in 1 short conversational sentence (under 12 words max).` },
        { role: "user", content: text }
      ];

      const attempts = [];
      if (provider === "groq") {
        attempts.push({ url: "https://api.groq.com/openai/v1/chat/completions", key: key, model: model.includes("gemini") ? "llama-3.1-8b-instant" : model });
        attempts.push({ url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions", key: key, model: "gemini-2.5-flash" });
        if (vps) attempts.push({ url: vps, key: key, model: "auto/best-coding" });
      } else if (provider === "google") {
        attempts.push({ url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions", key: key, model: "gemini-2.5-flash" });
        attempts.push({ url: "https://api.groq.com/openai/v1/chat/completions", key: key, model: "llama-3.1-8b-instant" });
        if (vps) attempts.push({ url: vps, key: key, model: "auto/best-coding" });
      } else if (provider === "hermes_vps" && vps) {
        attempts.push({ url: vps, key: key, model: "auto/best-coding" });
        attempts.push({ url: "https://api.groq.com/openai/v1/chat/completions", key: key, model: "llama-3.1-8b-instant" });
        attempts.push({ url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions", key: key, model: "gemini-2.5-flash" });
      } else {
        attempts.push({ url: "https://api.groq.com/openai/v1/chat/completions", key: key, model: "llama-3.1-8b-instant" });
        attempts.push({ url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions", key: key, model: "gemini-2.5-flash" });
        if (vps) attempts.push({ url: vps, key: key, model: "auto/best-coding" });
      }

      let sentenceBuffer = "";
      let fullResponseText = "";
      let success = false;

      for (const attempt of attempts) {
        try {
          sentenceBuffer = "";
          fullResponseText = "";
          assistantBubble.textContent = "";

          fullResponseText = await executeCallStream(attempt.url, attempt.key, attempt.model, messages, (delta, currentFull) => {
            assistantBubble.textContent = currentFull;
            sentenceBuffer += delta;
            
            // Trigger audio on punctuation OR after 4 words for instant speech
            const match = sentenceBuffer.match(/([^.!?,\n]+[.!?,\n]+)/);
            if (match) {
              const sentenceToSpeak = match[1];
              sentenceBuffer = sentenceBuffer.slice(sentenceToSpeak.length);
              queueSentenceSpeech(sentenceToSpeak, langInfo.locale);
            } else if (sentenceBuffer.split(" ").length >= 5) {
              const words = sentenceBuffer.split(" ");
              const chunkToSpeak = words.slice(0, 4).join(" ");
              sentenceBuffer = words.slice(4).join(" ");
              queueSentenceSpeech(chunkToSpeak, langInfo.locale);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
          });

          if (sentenceBuffer.trim()) {
            queueSentenceSpeech(sentenceBuffer, langInfo.locale);
          }

          if (fullResponseText) {
            success = true;
            break;
          }
        } catch (e) {
          console.warn("Streaming provider attempt failed:", attempt.url, e);
        }
      }

      if (!success) {
        assistantBubble.textContent = "Erreur de connexion aux IA. Vérifie ta clé API ou ton endpoint VPS.";
      }
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    sendBtn.onclick = () => sendPrompt(userInput.value);
    userInput.onkeydown = (e) => { if (e.key === "Enter") sendPrompt(userInput.value); };

    // Speech Recognition with Push-To-Talk, Ultra-Fast VAD & Strict Language Binding
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let startMicRecording = null;
    let stopMicRecording = null;

    if (SpeechRecognition) {
      let activeRec = null;
      let silenceTimer = null;
      let isRecording = false;

      startMicRecording = () => {
        if (isRecording) return;
        warmupSpeech();
        const langInfo = LANGUAGES.find(l => l.id === currentLang) || LANGUAGES[0];
        userInput.value = "";

        if (activeRec) {
          try { activeRec.stop(); } catch(e) {}
          activeRec = null;
        }

        activeRec = new SpeechRecognition();
        activeRec.continuous = true;
        activeRec.interimResults = true;
        activeRec.lang = langInfo.locale; // Direct BCP-47 locale (ex: "de-DE", "fr-FR", "es-ES")

        activeRec.onresult = (e) => {
          let transcript = "";
          for (let i = 0; i < e.results.length; i++) {
            transcript += e.results[i][0].transcript;
          }
          userInput.value = transcript;

          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (isRecording && activeRec) {
              try { activeRec.stop(); } catch(err) {}
            }
          }, 350);
        };

        activeRec.onerror = (e) => {
          console.warn("Speech recognition error:", e);
          isRecording = false;
          micBtn.classList.remove("recording");
          clearTimeout(silenceTimer);
        };

        activeRec.onend = () => {
          isRecording = false;
          micBtn.classList.remove("recording");
          clearTimeout(silenceTimer);
          const textToSend = userInput.value.trim();
          if (textToSend) {
            sendPrompt(textToSend);
          }
        };

        try {
          activeRec.start();
          isRecording = true;
          micBtn.classList.add("recording");
        } catch(e) {
          console.warn("Recognition start error:", e);
        }
      };

      stopMicRecording = () => {
        if (isRecording && activeRec) {
          clearTimeout(silenceTimer);
          try { activeRec.stop(); } catch(e) {}
        }
      };

      // Push to Talk: Hold to speak, release to send immediately!
      micBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        startMicRecording();
      });

      micBtn.addEventListener("pointerup", (e) => {
        e.preventDefault();
        stopMicRecording();
      });

      micBtn.addEventListener("mouseleave", () => {
        if (isRecording) stopMicRecording();
      });
    }
  </script>
</body>
</html>
